org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The JVM that runs Gradle itself, and with it AGP, kotlinc and d8/R8.
#
# This box defaults to JDK 26 and AGP 8.13 rejects it at configuration time, so
# without this line the build only works when JAVA_HOME is exported by hand and
# a fresh session walks into the wall. A Gradle toolchain alone does not fix
# that: a toolchain picks the JDK the compilers run on, which is chosen after
# AGP has already refused the daemon's JVM. This line is the one that decides.
#
# It is an absolute path and therefore specific to this machine, which is the
# only machine that builds Maia. The toolchain declarations in the modules say
# 21 as well, so the two agree and the toolchain resolves to this same JVM
# without going looking for another.
